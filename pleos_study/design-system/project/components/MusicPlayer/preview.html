<!doctype html>
<html>
<head><meta charset="utf-8"><title>MusicPlayer — preview</title></head>
<body>
<div class="acd-stage">
  <section class="acd-player" style="width:1000px;height:390px">
    <div class="acd-player__backdrop" style="background:linear-gradient(135deg,#2f5a1e,#6b7a2a)"></div>
    <div class="acd-player__scrim"></div>
    <div class="acd-player__body">
      <div class="acd-player__art" style="background:radial-gradient(circle at 70% 30%,#d9c27a99,#d9c27a00 45%),linear-gradient(135deg,#2f5a1e,#6b7a2a)"></div>
      <div class="acd-player__info">
        <div class="acd-player__title">Runaway</div>
        <div class="acd-player__artist">리센느 — Runaway - Single</div>
        <div class="acd-player__track"><i style="width:62%"></i></div>
        <div class="acd-player__times acd-num"><span>2:14</span><span>-1:19</span></div>
        <div class="acd-player__controls">
          <button class="acd-glyph is-on" type="button" aria-label="셔플"><svg viewBox="0 0 24 24"><path d="M10.59,9.17L5.41,4 4,5.41l5.17,5.17 1.42,-1.41zM14.5,4l2.04,2.04L4,18.59 5.41,20 17.96,7.46 20,9.5L20,4h-5.5zM14.83,13.41l-1.41,1.41 3.13,3.13L14.5,20L20,20v-5.5l-2.04,2.04 -3.13,-3.13z"/></svg></button>
          <button class="acd-glyph acd-glyph--lg" type="button" aria-label="이전 곡"><svg viewBox="0 0 24 24"><path d="M11,18V6l-8.5,6 8.5,6zM11.5,12l8.5,6V6l-8.5,6z"/></svg></button>
          <button class="acd-glyph acd-glyph--lg" type="button" aria-label="일시정지"><svg viewBox="0 0 24 24"><path d="M6,19h4V5H6v14zM14,5v14h4V5h-4z"/></svg></button>
          <button class="acd-glyph acd-glyph--lg" type="button" aria-label="다음 곡"><svg viewBox="0 0 24 24"><path d="M4,18l8.5,-6L4,6v12zM13,6v12l8.5,-6L13,6z"/></svg></button>
          <button class="acd-glyph" type="button" aria-label="반복"><svg viewBox="0 0 24 24"><path d="M7,7h10v3l4,-4 -4,-4v3L5,5v6h2L7,7zM17,17L7,17v-3l-4,4 4,4v-3h12v-6h-2v4z"/></svg></button>
        </div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
